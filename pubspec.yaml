name: benta_track_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # Flutter Core
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_vertexai: ^1.3.0

  # Authentication & Social Sign-In (v7.x enabled)
  google_sign_in: ^6.2.2
  flutter_dotenv: ^5.1.0

  # AI, ML Kit & Machine Learning
  path_provider: ^2.1.2
  google_generative_ai: ^0.4.0
  google_mlkit_barcode_scanning: ^0.16.1
  google_mlkit_object_detection: ^0.16.0
  google_mlkit_image_labeling: ^0.15.0
  google_mlkit_text_recognition: ^0.16.0
  tflite_flutter_custom: ^1.2.5

  # Camera & Hardware
  camera: ^0.11.0
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2

  # UI, Charts & Icons
  font_awesome_flutter: ^10.7.0
  fl_chart: ^0.68.0

  # Database & Local Storage
  sqflite: ^2.3.3+1
  shared_preferences: ^2.2.3

  # Utilities & Networking
  intl: ^0.19.0
  http: ^1.2.1
  url_launcher: ^6.3.0
  path: ^1.9.0

  # Build Assets Tooling
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Asset Registrations
  assets:
    - assets/benta_track_logo.png
    - .env
# App Launcher Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/benta_track_logo.png"
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: "assets/benta_track_logo.png"
  remove_alpha_ios: true