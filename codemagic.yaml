workflows:
  ios-release:
    name: iOS Build & IPA Generation
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Configure iOS Deployment Target
        script: |
          cd ios
          echo "platform :ios, '15.0'" > Podfile
          pod repo update
      - name: Get dependencies
        script: flutter pub get
      - name: Install pods
        script: |
          cd ios && pod install
      - name: Build IPA (Unsigned / Local Sideload)
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa